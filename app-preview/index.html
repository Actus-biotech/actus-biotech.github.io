<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actus — App Preview</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 0; box-sizing: border-box;
    font-family: var(--font-sans);
    background: transparent;
  }
  #stage { transform-origin: center center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="_ds_bundle.js?v=20260614"></script>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script type="text/babel">
const tweaks = { cautionMuscle: 'L. Calf', fatigueMuscle: 'R. Quad', readiness: 78 };

function App() {
  const { IOSDevice, AppShell, InsightScreen, SensorsScreen, SessionsScreen,
          LiveSessionScreen, ExercisesScreen, HistoryScreen, SensorDetailSheet } = window;

  const [view, setView]                   = React.useState('insight');
  const [activeSession, setActiveSession] = React.useState(null);
  const [sensorDetail, setSensorDetail]   = React.useState(null);

  const handleStartSession = (session) => { setActiveSession(session); setView('live'); };
  const handleEndSession   = ()         => { setActiveSession(null);   setView('history'); };

  const sensorOverlay = sensorDetail
    ? <SensorDetailSheet sensor={sensorDetail} onClose={() => setSensorDetail(null)} />
    : null;

  if (view === 'live') {
    return (
      <IOSDevice dark>
        <LiveSessionScreen session={activeSession} onEnd={handleEndSession} tweaks={tweaks} />
      </IOSDevice>
    );
  }

  let screen;
  if      (view === 'insight')   screen = <InsightScreen tweaks={tweaks} />;
  else if (view === 'sensors')   screen = <SensorsScreen onSensorDetail={setSensorDetail} />;
  else if (view === 'sessions')  screen = <SessionsScreen onStart={handleStartSession} />;
  else if (view === 'exercises') screen = <ExercisesScreen />;
  else if (view === 'history')   screen = <HistoryScreen />;

  return (
    <IOSDevice dark>
      <AppShell tab={view} setTab={setView} overlay={sensorOverlay}>{screen}</AppShell>
    </IOSDevice>
  );
}

function fit() {
  const stage = document.getElementById('stage');
  const padV = 80;
  const padH = 40;
  const s = Math.min(1, (window.innerHeight - padV) / 874, (window.innerWidth - padH) / 402);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
setTimeout(fit, 50);
</script>
</body>
</html>
